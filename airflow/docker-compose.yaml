x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.1
  env_file: .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    # Install packages at container start (now with working DNS)
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas numpy nltk sqlalchemy pymysql python-dotenv"
    # Tell Python where to find your src folder
    PYTHONPATH: "/opt/airflow/src"
    # Your RDS credentials
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: ${DB_NAME}
    GROQ_API_KEY: ${GROQ_API_KEY}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ../src:/opt/airflow/src
  tmpfs:
    - /opt/airflow/logs          # logs in RAM – no Windows permission issues
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - airflow_net

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - airflow_net

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname admin \
          --lastname admin \
          --role Admin \
          --email nirbhay105633016@example.com
    user: "0:0"
    networks:
      - airflow_net
    tmpfs:
      - /opt/airflow/logs

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow_net
    tmpfs:
      - /opt/airflow/logs

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow_net
    tmpfs:
      - /opt/airflow/logs

networks:
  airflow_net:
    driver: bridge

volumes:
  postgres-db-volume: